<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocupação Francisco Bernardo - Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }

        .btn-red {
            background-color: #d90429;
            transition: all 0.3s ease;
        }

        .btn-red:hover {
            background-color: #ef233c;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(217, 4, 41, 0.4);
        }

        .outline-text {
            -webkit-text-stroke: 1px #d90429;
            color: transparent;
        }

        /* Animação suave para os botões */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-zinc-900 via-black to-black">

    <div class="max-w-md w-full text-center">
        <!-- Logo / Cabeçalho -->
        <div class="mb-8 fade-in">
            <div class="w-24 h-24 bg-red-600 rounded-full mx-auto flex items-center justify-center mb-4 shadow-lg shadow-red-900/20">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>
            </div>
            <h1 class="text-3xl font-black uppercase tracking-tighter mb-2">Ocupação <span class="text-red-600">Francisco Bernardo</span></h1>
            <p class="text-zinc-400 font-medium">Luta por moradia e dignidade em Curitiba</p>
        </div>

        <!-- Links Principais -->
        <div class="space-y-4">
            
            <!-- Botão Live (Destaque Pulsante) -->
            <a href="https://youtube.com/@seucanal" target="_blank" class="block w-full p-4 rounded-xl btn-red font-bold flex items-center justify-between group fade-in delay-1 relative overflow-hidden">
                <span class="flex items-center">
                    <span class="relative flex h-3 w-3 mr-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
                    </span>
                    Acompanhe ao Vivo agora!
                </span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
            </a>

            <!-- Manifesto -->
            <a href="#" class="block w-full p-4 rounded-xl bg-zinc-800 border border-zinc-700 hover:border-red-600 font-bold flex items-center justify-between transition-all fade-in delay-2">
                <span>Ler o Manifesto da Ocupação</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
            </a>

            <!-- Contato de Imprensa -->
            <a href="https://wa.me/5541999999999" class="block w-full p-4 rounded-xl bg-zinc-800 border border-zinc-700 hover:border-red-600 font-bold flex items-center justify-between transition-all fade-in delay-3">
                <span>Contato de Imprensa</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </a>

        </div>

        <!-- Rodapé / Social -->
        <div class="mt-12 flex justify-center space-x-6 text-zinc-500 fade-in delay-3">
            <a href="#" class="hover:text-red-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
            </a>
            <a href="#" class="hover:text-red-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>
            </a>
            <a href="#" class="hover:text-red-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
            </a>
        </div>

        <p class="mt-8 text-xs text-zinc-600 uppercase tracking-widest font-bold">
            Poder Popular & Organização
        </p>
    </div>

</body>
</html>
