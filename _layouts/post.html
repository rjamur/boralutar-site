<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Boralutar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-story: 'Lora', serif;
            --font-ui: 'Inter', sans-serif;
            --font-tech: 'Space Mono', monospace;
        }
        
        body {
            font-family: var(--font-story);
            background-color: #09090b; /* zinc-950 */
            color: #d4d4d8; /* zinc-300 */
        }

        .font-ui { font-family: var(--font-ui); }
        .font-tech { font-family: var(--font-tech); }

        ::selection {
            background-color: #ef4444; /* red-500 */
            color: #ffffff;
        }

        /* Estilização para o Markdown gerado pelo Jekyll */
        .markdown-body p {
            margin-bottom: 1.5rem;
            line-height: 2;
            font-size: 1.125rem;
        }

        @media (min-width: 768px) {
            .markdown-body p { font-size: 1.25rem; }
        }

        .markdown-body h1 {
            font-family: var(--font-ui);
            font-weight: 900;
            font-size: 2.25rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            margin-top: 2rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #ef4444;
            padding-left: 1rem;
        }

        .markdown-body h2 {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 1.5rem;
            color: #f43f5e;
            text-transform: uppercase;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
        }

        .markdown-body blockquote {
            font-family: var(--font-ui);
            border-left: 4px solid #71717a;
            padding-left: 1.25rem;
            margin: 2rem 0;
            color: #e4e4e7;
            font-style: italic;
        }

        .markdown-body ul {
            list-style-type: square;
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
            color: #a1a1aa;
        }

        .markdown-body hr {
            border-color: #27272a;
            margin: 3rem 0;
        }

        .glow-red { box-shadow: 0 0 30px rgba(239, 68, 68, 0.15); }
        .glow-slate { box-shadow: 0 0 25px rgba(100, 116, 139, 0.2); }
    </style>
</head>
<body class="relative min-h-screen pb-24 selection:bg-red-500 selection:text-white">

    <!-- Header Terminal -->
    <header class="w-full py-6 px-4 border-b border-zinc-800/50 flex justify-center sticky top-0 bg-zinc-950/80 backdrop-blur-sm z-50">
        <a href="{{ site.baseurl }}/historias/index.html" class="font-tech text-zinc-500 text-sm tracking-widest hover:text-zinc-300 transition-colors uppercase">
            &larr; Voltar ao Sistema Central
        </a>
    </header>

    <main class="max-w-2xl mx-auto px-5 sm:px-6 py-12 md:py-20">
        <article>
            <!-- Cabeçalho Automático da Postagem -->
            <header class="mb-14 border-b border-zinc-800/50 pb-10">
                <div class="font-tech text-red-500 text-xs tracking-[0.2em] uppercase font-bold mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                    {{ page.category | default: "Relato" }} // {{ page.date | date: "%d/%m/%Y" }}
                </div>
                <h1 class="font-ui font-black text-4xl md:text-5xl text-white mb-6 leading-tight tracking-tighter uppercase">
                    {{ page.title }}
                </h1>
                {% if page.subtitle %}
                <p class="font-ui text-lg md:text-xl text-zinc-400 font-medium leading-relaxed border-l-4 border-red-600 pl-4 text-left">
                    {{ page.subtitle }}
                </p>
                {% endif %}
            </header>

            <!-- Conteúdo Markdown Injetado -->
            <div class="markdown-body text-zinc-300">
                {{ content }}
            </div>
        </article>
    </main>

    <!-- Rodapé -->
    <footer class="w-full border-t border-zinc-800/50 py-8 px-4 text-center mt-auto">
        <p class="font-tech text-xs text-zinc-600 uppercase tracking-widest">
            A dor é biológica. A sobrevivência é código.
        </p>
    </footer>

</body>
</html>
