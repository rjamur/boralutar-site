<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocupação Francisco Bernardo - O Castelo de Tocas</title>
    <style>
        :root {
            --bg: #050505;
            --text: #ffffff;
            --accent-red: #e60000;
            --accent-yellow: #ffea00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            border-left: 12px solid var(--accent-red);
            padding-left: 1.5rem;
        }

        h1 {
            /* clamp() garante que a fonte seja gigante no PC e legível no celular sem quebrar tudo */
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            line-height: 0.95;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
        }

        h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            color: var(--accent-yellow);
            margin-bottom: 4rem;
            letter-spacing: -0.01em;
        }

        .impact-phrase {
            display: inline-block;
            background-color: var(--accent-red);
            color: var(--text);
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            padding: 0.5rem 1.5rem;
            margin-bottom: 4rem;
            letter-spacing: -0.02em;
            /* Animação pulsante para guiar o olho */
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(230, 0, 0, 0.7); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px 10px rgba(230, 0, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(230, 0, 0, 0); }
        }

        .contacts {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .contact-link {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            color: var(--text);
            text-decoration: none;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 800;
            border: 4px solid var(--text);
            padding: 1rem 1.5rem;
            transition: all 0.2s ease;
            background-color: transparent;
            width: fit-content;
        }

        .contact-link:hover, .contact-link:active {
            background-color: var(--text);
            color: var(--bg);
            transform: translate(4px, -4px);
            box-shadow: -4px 4px 0px var(--accent-red);
        }

        @media (min-width: 768px) {
            .container {
                padding-left: 3rem;
            }
            .contacts {
                flex-direction: row;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Ocupação Francisco Bernardo - O Castelo de Tocas</h1>
        <h2>Rua Dr. Faivre, 1212</h2>
        
        <div class="impact-phrase">"Eu moro aqui."</div>
        
        <div class="contacts">
            <a href="https://wa.me/5541992313435" target="_blank" rel="noopener noreferrer" class="contact-link">
                WhatsApp: (41) 99231-3435
            </a>
            <a href="mailto:jamur@ufpr.br" class="contact-link">
                E-mail: jamur@ufpr.br
            </a>
        </div>
    </main>
</body>
</html>
